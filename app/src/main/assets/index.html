<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kick Buddy 3D: Syringes & Elements</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10141d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Screen FX Overlays */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: white;
      opacity: 0;
      z-index: 100;
      transition: opacity 0.08s ease-out;
    }
    #acid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(76, 255, 0, 0.08) 0%, rgba(20, 180, 20, 0.28) 100%);
      opacity: 0;
      z-index: 90;
      transition: opacity 0.4s ease;
    }

    /* Top HUD */
    #hud-top {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 20;
    }
    .hud-card {
      background: rgba(18, 24, 38, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 10px 16px;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .score-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff9800;
    }
    .score-value {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 152, 0, 0.6);
      transition: transform 0.1s ease;
    }
    .score-bounce {
      transform: scale(1.22);
      color: #ffeb3b;
    }
    .stat-row {
      display: flex;
      gap: 12px;
      font-size: 11px;
      font-weight: 700;
      color: #90a4ae;
      margin-top: 2px;
    }
    .stat-val {
      color: #00e5ff;
      font-weight: 800;
    }
    .buddy-status {
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Top Action Buttons */
    .action-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .side-btn {
      pointer-events: auto;
      background: rgba(22, 27, 34, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 9px 13px;
      color: #cfd8dc;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.15s, transform 0.1s;
    }
    .side-btn:active {
      transform: scale(0.94);
      background: rgba(255, 152, 0, 0.3);
    }

    /* Floating Hit Text */
    .hit-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: 20px;
      transform: translate(-50%, -50%);
      color: #ffeb3b;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 87, 34, 0.8);
      animation: popFade 0.75s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      z-index: 50;
    }
    @keyframes popFade {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
      20% { opacity: 1; transform: translate(-50%, -18px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -55px) scale(0.9); }
    }

    /* Bottom Control Docks */
    #dock-container {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    /* Category bar */
    #category-bar {
      display: flex;
      gap: 6px;
      pointer-events: auto;
      background: rgba(15, 20, 28, 0.85);
      padding: 4px 8px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
    }
    .cat-tab {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .cat-tab.active {
      background: rgba(255, 152, 0, 0.25);
      color: #ffb703;
      border: 1px solid rgba(255, 183, 3, 0.4);
    }

    /* Weapon / Tool Dock */
    #weapon-bar {
      display: flex;
      gap: 8px;
      background: rgba(13, 17, 23, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 8px 10px;
      border-radius: 20px;
      box-shadow: 0 10px 32px rgba(0,0,0,0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: auto;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #weapon-bar::-webkit-scrollbar {
      display: none;
    }
    .tool-btn {
      flex: 0 0 auto;
      min-width: 62px;
      height: 60px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .tool-btn .icon {
      font-size: 22px;
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .tool-btn.active {
      background: linear-gradient(135deg, #ff6b35, #ff3b00);
      border-color: #ffeb3b;
      color: #ffffff;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 16px rgba(255, 87, 34, 0.5);
    }
    .tool-btn:active {
      transform: scale(0.92);
    }

    #tip-banner {
      color: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      font-weight: 600;
      background: rgba(0,0,0,0.55);
      padding: 5px 14px;
      border-radius: 14px;
      letter-spacing: 0.3px;
      text-align: center;
    }

    /* Pit / Pool Selector Pill */
    #pit-selector {
      display: flex;
      gap: 6px;
      pointer-events: auto;
      background: rgba(20, 25, 36, 0.9);
      padding: 4px 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 2px;
    }
    .pit-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
      cursor: pointer;
    }
    .pit-btn.active {
      background: rgba(0, 229, 255, 0.2);
      border-color: #00e5ff;
      color: #00e5ff;
    }

    /* Update Modal */
    #update-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
  </style>
  <script src="libs/engine.bundle.js"></script>
</head>
<body>
  <div id="flash-overlay"></div>
  <div id="acid-overlay"></div>
  <div id="canvas-container"></div>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-card">
      <div class="score-label">KICK BUDDY 3D</div>
      <div id="score" class="score-value">0</div>
      <div class="stat-row">
        <span>STATUS: <span id="buddy-status-text" class="stat-val">Normal</span></span>
        <span>VEL: <span id="speed-val" class="stat-val">0.0 m/s</span></span>
      </div>
      <div class="stat-row">
        <span>WEATHER: <span id="weather-text" class="stat-val">Clear</span></span>
        <span>PIT: <span id="pit-text" class="stat-val">None</span></span>
      </div>
    </div>

    <div class="action-col">
      <button class="side-btn" id="btn-update">
        <span>🔄</span> Check Update
      </button>
      <button class="side-btn" id="btn-reset">
        <span>🔄</span> Revive Buddy
      </button>
      <button class="side-btn" id="btn-gravity">
        <span>🌍</span> Zero G
      </button>
      <button class="side-btn" id="btn-slowmo">
        <span>⏱️</span> Slow-Mo
      </button>
    </div>
  </div>

  <!-- Update Modal -->
  <div id="update-modal">
    <div style="background:#161b22; border:1px solid #30363d; border-radius:18px; padding:24px; max-width:320px; width:85%; color:#fff; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.8);">
      <div style="font-size:36px; margin-bottom:10px;">🚀</div>
      <div style="font-size:18px; font-weight:800; margin-bottom:8px;" id="update-title">Update Available!</div>
      <div style="font-size:13px; color:#8b949e; margin-bottom:20px;" id="update-desc">A new version of Kick Buddy 3D is available on GitHub.</div>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button id="update-cancel-btn" style="background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:10px 16px; border-radius:10px; font-weight:700; cursor:pointer;">Later</button>
        <button id="update-confirm-btn" style="background:linear-gradient(135deg, #238636, #2ea043); border:none; color:#fff; padding:10px 18px; border-radius:10px; font-weight:700; cursor:pointer;">Install Now</button>
      </div>
    </div>
  </div>

  <!-- Bottom Weapon & Interaction Dock -->
  <div id="dock-container">
    <div id="tip-banner">Tap & drag Buddy's limbs | Inject 3D syringes, summon pits, or unleash weather</div>

    <!-- Category Tabs -->
    <div id="category-bar">
      <button class="cat-tab active" data-cat="syringes">💉 Syringes</button>
      <button class="cat-tab" data-cat="pits">🕳️ Pits & Pools</button>
      <button class="cat-tab" data-cat="weather">⛈️ Weather</button>
      <button class="cat-tab" data-cat="elements">⚡ Elements</button>
    </div>

    <!-- Subcategory: Pit Selector Bar (shown when pits cat active) -->
    <div id="pit-selector" style="display:none;">
      <button class="pit-btn active" data-pit="none">None</button>
      <button class="pit-btn" data-pit="fire">🔥 Fire Pit</button>
      <button class="pit-btn" data-pit="acid">🧪 Acid Pit</button>
      <button class="pit-btn" data-pit="pool">🌊 Water Pool</button>
    </div>

    <!-- Weapon / Tool items row -->
    <div id="weapon-bar">
      <!-- Injected dynamically by category -->
    </div>
  </div>

  <script>
    /* ============================================================
       1. AUDIO SYNTHESIS ENGINE (Procedural Web Audio API)
       ============================================================ */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function initAudio() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180 + Math.random() * 80, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.14);
        gain.gain.setValueAtTime(0.65, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'inject') {
        // High-pitched needle puncture & fluid squirt
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(2200, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.22);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'sizzle' || type === 'acid') {
        // Noise hiss
        const bufferSize = audioCtx.sampleRate * 0.35;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2500, now);
        filter.Q.setValueAtTime(3.0, now);
        const sizzleGain = audioCtx.createGain();
        sizzleGain.gain.setValueAtTime(0.6, now);
        sizzleGain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        noise.connect(filter);
        filter.connect(sizzleGain);
        sizzleGain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'fire') {
        // Crackle/rumble
        const bufferSize = audioCtx.sampleRate * 0.25;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() - 0.5) * 1.5;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, now);
        const fGain = audioCtx.createGain();
        fGain.gain.setValueAtTime(0.8, now);
        fGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        noise.connect(filter);
        filter.connect(fGain);
        fGain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'freeze') {
        // Crystalline high bell chime
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(2800, now + 0.1);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'zap') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.05);
        osc.frequency.linearRampToValueAtTime(120, now + 0.15);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'splash') {
        // Water splash thump + hiss
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'thunder') {
        // Heavy rolling thunder
        const bufferSize = audioCtx.sampleRate * 0.9;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(250, now);
        filter.frequency.exponentialRampToValueAtTime(40, now + 0.85);
        const tGain = audioCtx.createGain();
        tGain.gain.setValueAtTime(1.0, now);
        tGain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
        noise.connect(filter);
        filter.connect(tGain);
        tGain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'heal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.25);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    function nativeVibrate(type) {
      if (window.AndroidNative && window.AndroidNative.vibrate) {
        window.AndroidNative.vibrate(type);
      } else if (navigator.vibrate) {
        if (type === 'light') navigator.vibrate(15);
        else if (type === 'heavy') navigator.vibrate(60);
        else if (type === 'explosion') navigator.vibrate([40, 30, 80]);
        else navigator.vibrate(25);
      }
    }

    /* ============================================================
       2. THREE.JS SCENE, CAMERA, & LIGHTING
       ============================================================ */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x131924);
    scene.fog = new THREE.FogExp2(0x131924, 0.032);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.4, 10.8);
    camera.lookAt(0, 2.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff3e0, 2.0);
    dirLight.position.set(5, 14, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -6;
    dirLight.shadow.camera.right = 6;
    dirLight.shadow.camera.top = 8;
    dirLight.shadow.camera.bottom = -4;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const rimLightBlue = new THREE.PointLight(0x00d9ff, 3.2, 16);
    rimLightBlue.position.set(-6, 3.5, 2);
    scene.add(rimLightBlue);

    const rimLightOrange = new THREE.PointLight(0xff5722, 3.2, 16);
    rimLightOrange.position.set(6, 4.5, -2);
    scene.add(rimLightOrange);

    /* ============================================================
       3. CANNON-ES PHYSICS WORLD & ROOM
       ============================================================ */
    const world = new CANNON.World();
    world.gravity.set(0, -18, 0);
    world.solver.iterations = 10;
    world.defaultContactMaterial.friction = 0.45;
    world.defaultContactMaterial.restitution = 0.32;

    let floorMesh, floorBody;
    function createGroundAndWalls() {
      // Procedural Kick Buddy Cardboard / Padded Room Texture
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      // Warm burlap / padded workshop floor
      ctx.fillStyle = '#222938';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#323c50';
      ctx.lineWidth = 4;
      for (let i = 0; i <= 512; i += 64) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, 512);
        ctx.moveTo(0, i); ctx.lineTo(512, i);
        ctx.stroke();
      }
      // Target bullseye circle
      ctx.strokeStyle = '#ff9800';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(256, 256, 130, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(256, 256, 65, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ff9800';
      ctx.beginPath(); ctx.arc(256, 256, 20, 0, Math.PI * 2); ctx.fill();

      const floorTex = new THREE.CanvasTexture(canvas);
      floorTex.wrapS = THREE.RepeatWrapping;
      floorTex.wrapT = THREE.RepeatWrapping;
      floorTex.repeat.set(2, 2);

      const floorMat = new THREE.MeshStandardMaterial({
        map: floorTex,
        roughness: 0.6,
        metalness: 0.15
      });
      floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      floorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      world.addBody(floorBody);

      // Hazard Back Wall
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x161c28, roughness: 0.75 });
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 16), wallMat);
      backWall.position.set(0, 8, -6);
      backWall.receiveShadow = true;
      scene.add(backWall);

      const backWallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      backWallBody.position.set(0, 8, -6);
      world.addBody(backWallBody);

      // Invisible Side Cushions
      const leftWallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      leftWallBody.position.set(-6.2, 5, 0);
      leftWallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
      world.addBody(leftWallBody);

      const rightWallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      rightWallBody.position.set(6.2, 5, 0);
      rightWallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -Math.PI / 2);
      world.addBody(rightWallBody);

      const ceilingBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      ceilingBody.position.set(0, 12, 0);
      ceilingBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), Math.PI / 2);
      world.addBody(ceilingBody);
    }

    let currentPitType = 'none';

    let pitLiquidMesh = null;

    function setupPitStructure() {
      pitMeshGroup = new THREE.Group();
      scene.add(pitMeshGroup);

      // Outer Rim Border
      const rimGeo = new THREE.BoxGeometry(4.4, 0.35, 4.4);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0x2e384d, roughness: 0.8 });
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.position.y = 0.15;
      rim.castShadow = true;
      rim.receiveShadow = true;
      pitMeshGroup.add(rim);

      const liqGeo = new THREE.PlaneGeometry(3.9, 3.9, 16, 16);

        color: 0x00e5ff,
        transparent: true,

      });

      pitLiquidMesh.rotation.x = -Math.PI / 2;
      pitLiquidMesh.position.y = 0.22;
      pitMeshGroup.add(pitLiquidMesh);

      // Glow Light
      pitLight = new THREE.PointLight(0xff5722, 0, 8);
      pitLight.position.set(0, 1.2, 0);
      pitMeshGroup.add(pitLight);

      pitMeshGroup.position.set(0, 0, 0.5);
      pitMeshGroup.visible = false;

    setupPitStructure();

    function setPit(type) {
      currentPitType = type;
      document.getElementById('pit-text').innerText = type === 'none' ? 'None' : type.toUpperCase();
      document.querySelectorAll('.pit-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-pit') === type);
      });

      if (type === 'none') {
        pitMeshGroup.visible = false;
        pitLight.intensity = 0;
      } else {
        pitMeshGroup.visible = true;
        if (type === 'fire') {
          pitLiquidMesh.material.color.setHex(0xff3d00);
          pitLiquidMesh.material.emissive = new THREE.Color(0xff4500);
          pitLiquidMesh.material.emissiveIntensity = 0.8;
          pitLight.color.setHex(0xff5722);
          pitLight.intensity = 4.0;
          playSound('fire');
        } else if (type === 'acid') {
          pitLiquidMesh.material.color.setHex(0x39ff14);
          pitLiquidMesh.material.emissive = new THREE.Color(0x2ebd0b);
          pitLiquidMesh.material.emissiveIntensity = 0.7;
          pitLight.color.setHex(0x39ff14);
          pitLight.intensity = 3.5;
          playSound('acid');
        } else if (type === 'pool') {
          pitLiquidMesh.material.color.setHex(0x00b4d8);
          pitLiquidMesh.material.emissive = new THREE.Color(0x0077b6);
          pitLiquidMesh.material.emissiveIntensity = 0.3;
          pitLight.color.setHex(0x00b4d8);
          pitLight.intensity = 2.0;
          playSound('splash');
        }
      }
    }

    /* ============================================================
       5. BUDDY RAGDOLL GENERATION (Classic Burlap Kick Buddy)

    // Classic Buddy Textures (burlap cloth, button eyes, mouth stitching)
    function createBuddyFaceTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const x = c.getContext('2d');
      // Warm burlap cloth background
      x.fillStyle = '#d4a373';
      x.fillRect(0, 0, 256, 256);
      // Fabric noise
      for (let i = 0; i < 4000; i++) {
        x.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.08)';
        x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      // Button Eyes (Left: black button, Right: cross button)
      x.fillStyle = '#1e1e1e';
      x.beginPath(); x.arc(88, 105, 20, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#ffffff';
      x.beginPath(); x.arc(84, 101, 4, 0, Math.PI * 2); x.fill();
      x.beginPath(); x.arc(92, 109, 4, 0, Math.PI * 2); x.fill();

      // Right Button (Red/Black)
      x.fillStyle = '#b7094c';
      x.beginPath(); x.arc(168, 105, 20, 0, Math.PI * 2); x.fill();
      x.strokeStyle = '#ffffff'; x.lineWidth = 3;
      x.beginPath(); x.moveTo(158, 95); x.lineTo(178, 115); x.stroke();
      x.beginPath(); x.moveTo(178, 95); x.lineTo(158, 115); x.stroke();

      // Stitched smile
      x.strokeStyle = '#331a00';
      x.lineWidth = 5;
      x.beginPath();
      x.arc(128, 145, 45, 0.2 * Math.PI, 0.8 * Math.PI);
      x.stroke();
      // Cross stitches across smile
      for (let s = 100; s <= 156; s += 14) {
        x.beginPath();
        x.moveTo(s, 168); x.lineTo(s + 2, 184);
        x.stroke();
      }
      // Head patch
      x.fillStyle = '#bc6c25';
      x.fillRect(140, 30, 45, 35);
      x.strokeStyle = '#fff'; x.lineWidth = 2;
      x.strokeRect(140, 30, 45, 35);

      return new THREE.CanvasTexture(c);
    }

    function createBuddyBodyTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const x = c.getContext('2d');
      x.fillStyle = '#cb997e';
      x.fillRect(0, 0, 256, 256);
      // Fabric noise
      for (let i = 0; i < 3000; i++) {
        x.fillStyle = Math.random() > 0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.06)';
        x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      // Belt and target stitch
      x.fillStyle = '#6b705c';
      x.fillRect(0, 200, 256, 40);
      x.fillStyle = '#ddbea9';
      x.fillRect(110, 195, 36, 50);

      // Central target cross
      x.strokeStyle = '#a5a58d'; x.lineWidth = 4;
      x.beginPath(); x.arc(128, 110, 35, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.moveTo(128, 65); x.lineTo(128, 155); x.stroke();
      x.beginPath(); x.moveTo(83, 110); x.lineTo(173, 110); x.stroke();

      return new THREE.CanvasTexture(c);
    }

    function createDummyLimb(mesh, shape, mass, position) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.copy(position);
      scene.add(mesh);

      const body = new CANNON.Body({
        mass: mass,
        linearDamping: 0.28,
        angularDamping: 0.35
      });
      body.addShape(shape);
      body.position.set(position.x, position.y, position.z);
      world.addBody(body);

      body.isDummyLimb = true;
      body.meshRef = mesh;
      dummyBodies.push(body);
      dummyMeshes.push(mesh);

      // Natural collision impact points & sounds
      body.addEventListener('collide', function(e) {
        const relVel = e.contact.getImpactVelocityAlongNormal();
        if (relVel > 3.0) {
          handleLimbImpact(body.position, relVel);
        }
      });

      return body;
    }

    function buildBuddyRagdoll(startX = 0, startY = 3.8, startZ = 0) {
      // Clean previous
      dummyConstraints.forEach(c => world.removeConstraint(c));
      dummyConstraints = [];
      dummyBodies.forEach(b => world.removeBody(b));
      dummyBodies = [];
      dummyMeshes.forEach(m => scene.remove(m));
      dummyMeshes = [];

      // Reset conditions
      buddyState.isBurning = false;
      buddyState.burnTimer = 0;
      buddyState.isAcidMelting = false;
      buddyState.acidTimer = 0;
      buddyState.isFrozen = false;
      buddyState.freezeTimer = 0;
      buddyState.isElectrified = false;
      buddyState.zapTimer = 0;
      buddyState.scale = 1.0;
      updateStatusBadge('Normal');

      // 1. Torso (Chest & Pelvis)
      const chestMesh = new THREE.Mesh(new THREE.BoxGeometry(0.88, 1.0, 0.52), buddyTorsoMat);
      chestBodyRef = createDummyLimb(chestMesh, new CANNON.Box(new CANNON.Vec3(0.44, 0.5, 0.26)), 12, new THREE.Vector3(startX, startY + 0.65, startZ));

      const pelvisMesh = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.55, 0.48), buddyLimbMat);

      const spineJoint = new CANNON.ConeTwistConstraint(chestBodyRef, pelvisBody, {
        pivotA: new CANNON.Vec3(0, -0.5, 0),
        pivotB: new CANNON.Vec3(0, 0.27, 0),
        axisA: CANNON.Vec3.UNIT_Y,
        axisB: CANNON.Vec3.UNIT_Y,
        angle: Math.PI / 8,
        twistAngle: Math.PI / 10
      });
      world.addConstraint(spineJoint);
      dummyConstraints.push(spineJoint);

      // 2. Head (Spherical classic Kick Buddy head)
      const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 24), buddyHeadMat);
      headMesh.rotation.y = -Math.PI / 2; // Face forward
      headBodyRef = createDummyLimb(headMesh, new CANNON.Sphere(0.42), 5.5, new THREE.Vector3(startX, startY + 1.52, startZ));

      const neckJoint = new CANNON.ConeTwistConstraint(headBodyRef, chestBodyRef, {
        pivotA: new CANNON.Vec3(0, -0.42, 0),
        pivotB: new CANNON.Vec3(0, 0.52, 0),
        axisA: CANNON.Vec3.UNIT_Y,
        axisB: CANNON.Vec3.UNIT_Y,
        angle: Math.PI / 6,
        twistAngle: Math.PI / 8
      });
      world.addConstraint(neckJoint);
      dummyConstraints.push(neckJoint);

      // 3. Arms (Upper & Forearm with Red Gloves)

      // Left Arm

      const leftUpperArmBody = createDummyLimb(leftUpperArmMesh, new CANNON.Cylinder(0.14, 0.14, 0.6, 12), 3, new THREE.Vector3(startX - 0.74, startY + 0.65, startZ));
      const leftForearmMesh = new THREE.Mesh(foreArmGeo, buddyHandFootMat);
      const leftForearmBody = createDummyLimb(leftForearmMesh, new CANNON.Cylinder(0.13, 0.13, 0.55, 12), 2.5, new THREE.Vector3(startX - 0.74, startY + 0.05, startZ));

      const leftShoulder = new CANNON.PointToPointConstraint(chestBodyRef, new CANNON.Vec3(-0.52, 0.35, 0), leftUpperArmBody, new CANNON.Vec3(0, 0.3, 0));
      const leftElbow = new CANNON.PointToPointConstraint(leftUpperArmBody, new CANNON.Vec3(0, -0.3, 0), leftForearmBody, new CANNON.Vec3(0, 0.28, 0));
      world.addConstraint(leftShoulder);
      world.addConstraint(leftElbow);
      dummyConstraints.push(leftShoulder, leftElbow);

      // Right Arm
      const rightUpperArmMesh = new THREE.Mesh(armGeo, buddyLimbMat);
      const rightUpperArmBody = createDummyLimb(rightUpperArmMesh, new CANNON.Cylinder(0.14, 0.14, 0.6, 12), 3, new THREE.Vector3(startX + 0.74, startY + 0.65, startZ));
      const rightForearmMesh = new THREE.Mesh(foreArmGeo, buddyHandFootMat);
      const rightForearmBody = createDummyLimb(rightForearmMesh, new CANNON.Cylinder(0.13, 0.13, 0.55, 12), 2.5, new THREE.Vector3(startX + 0.74, startY + 0.05, startZ));

      const rightShoulder = new CANNON.PointToPointConstraint(chestBodyRef, new CANNON.Vec3(0.52, 0.35, 0), rightUpperArmBody, new CANNON.Vec3(0, 0.3, 0));
      const rightElbow = new CANNON.PointToPointConstraint(rightUpperArmBody, new CANNON.Vec3(0, -0.3, 0), rightForearmBody, new CANNON.Vec3(0, 0.28, 0));
      world.addConstraint(rightShoulder);
      world.addConstraint(rightElbow);
      dummyConstraints.push(rightShoulder, rightElbow);

      // 4. Legs (Thigh & Shin with Red Boots)
      const legGeo = new THREE.CylinderGeometry(0.18, 0.15, 0.75, 16);

      // Left Leg
      const leftThighMesh = new THREE.Mesh(legGeo, buddyLimbMat);
      const leftThighBody = createDummyLimb(leftThighMesh, new CANNON.Cylinder(0.18, 0.15, 0.75, 12), 6, new THREE.Vector3(startX - 0.28, startY - 0.65, startZ));
      const leftShinMesh = new THREE.Mesh(shinGeo, buddyHandFootMat);
      const leftShinBody = createDummyLimb(leftShinMesh, new CANNON.Cylinder(0.15, 0.13, 0.7, 12), 4, new THREE.Vector3(startX - 0.28, startY - 1.45, startZ));

      const leftHip = new CANNON.PointToPointConstraint(pelvisBody, new CANNON.Vec3(-0.25, -0.28, 0), leftThighBody, new CANNON.Vec3(0, 0.38, 0));
      const leftKnee = new CANNON.PointToPointConstraint(leftThighBody, new CANNON.Vec3(0, -0.38, 0), leftShinBody, new CANNON.Vec3(0, 0.35, 0));
      world.addConstraint(leftHip);

      const rightShinMesh = new THREE.Mesh(shinGeo, buddyHandFootMat);
      const rightShinBody = createDummyLimb(rightShinMesh, new CANNON.Cylinder(0.15, 0.13, 0.7, 12), 4, new THREE.Vector3(startX + 0.28, startY - 1.45, startZ));

      const rightHip = new CANNON.PointToPointConstraint(pelvisBody, new CANNON.Vec3(0.25, -0.28, 0), rightThighBody, new CANNON.Vec3(0, 0.38, 0));
      const rightKnee = new CANNON.PointToPointConstraint(rightThighBody, new CANNON.Vec3(0, -0.38, 0), rightShinBody, new CANNON.Vec3(0, 0.35, 0));

    buildBuddyRagdoll();

    /* ============================================================
       6. 3D SYRINGE INJECTION SYSTEM
       ============================================================ */
    // Create an authentic 3D Syringe model attached to needle injection point
    function create3DSyringeModel(liquidColorHex) {
      const syringeGroup = new THREE.Group();

      // Clear Glass Barrel
      const barrelGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.7, 16);
      const barrelMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.5,
        roughness: 0.1,
        metalness: 0.1
      });
      const barrel = new THREE.Mesh(barrelGeo, barrelMat);
      barrel.position.y = 0.35;
      syringeGroup.add(barrel);

      // Colored Fluid Inside
      const fluidGeo = new THREE.CylinderGeometry(0.105, 0.105, 0.55, 16);
      const fluidMat = new THREE.MeshStandardMaterial({
        color: liquidColorHex,
        emissive: liquidColorHex,
        emissiveIntensity: 0.6,
        roughness: 0.2
      });
      const fluid = new THREE.Mesh(fluidGeo, fluidMat);
      fluid.position.y = 0.35;
      syringeGroup.add(fluid);

      // Plunger & Thumb Ring
      const plungerGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8);
      const plungerMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 });
      const plunger = new THREE.Mesh(plungerGeo, plungerMat);
      plunger.position.y = 0.85;
      syringeGroup.add(plunger);

      const ringGeo = new THREE.TorusGeometry(0.09, 0.02, 8, 16);
      const ring = new THREE.Mesh(ringGeo, plungerMat);
      ring.position.y = 1.1;
      ring.rotation.x = Math.PI / 2;
      syringeGroup.add(ring);

      // Metal Needle Point
      const needleGeo = new THREE.CylinderGeometry(0.02, 0.005, 0.35, 8);
      const needleMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95, roughness: 0.1 });
      const needle = new THREE.Mesh(needleGeo, needleMat);
      needle.position.y = -0.17;
      syringeGroup.add(needle);

      return syringeGroup;
    }

    const activeSyringes = [];
    function injectSyringeAt(targetBody, worldPt, type) {
      initAudio();
      playSound('inject');
      nativeVibrate('medium');
      addTrauma(0.2);

      let color = 0x39ff14;
      if (type === 'acid') color = 0x39ff14;
      else if (type === 'fire') color = 0xff3d00;
      else if (type === 'freeze') color = 0x00e5ff;
      else if (type === 'lightning') color = 0xffeb3b;
      else if (type === 'growth') color = 0x9c27b0;
      else if (type === 'death') color = 0x111111;
      else if (type === 'regen') color = 0x00ff88;

      // Create 3D Syringe mesh & pin into Buddy's limb
      const syringeMesh = create3DSyringeModel(color);
      syringeMesh.position.copy(worldPt);

      // Point needle inwards toward limb center
      const toLimb = new THREE.Vector3().subVectors(targetBody.position, worldPt).normalize();
      syringeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), toLimb);
      scene.add(syringeMesh);

      // Physics pin: keep syringe attached to limb
      const localOffset = new CANNON.Vec3();
      targetBody.pointToLocalFrame(new CANNON.Vec3(worldPt.x, worldPt.y, worldPt.z), localOffset);

      activeSyringes.push({
        mesh: syringeMesh,
        targetBody: targetBody,
        localOffset: localOffset,
        type: type,
        life: 14.0 // lasts 14 seconds before fading
      });

      // Spawn fluid squirt particles
      spawnSparks(worldPt.x, worldPt.y, worldPt.z, 20, [
        (color >> 16 & 255) / 255,
        (color >> 8 & 255) / 255,
        (color & 255) / 255
      ]);

      // Apply Syringe Biological Effect
      applySyringeEffect(type, targetBody, worldPt);
    }

    function applySyringeEffect(type, body, pt) {
      if (type === 'acid') {
        buddyState.isAcidMelting = true;
        buddyState.acidTimer = 8.0;
        updateStatusBadge('Melting (Acid)');
        body.applyImpulse(new CANNON.Vec3(0, 120, -50), body.position);
      } else if (type === 'fire') {
        buddyState.isBurning = true;
        buddyState.burnTimer = 8.0;
        updateStatusBadge('On Fire!');
        body.applyImpulse(new CANNON.Vec3(0, 150, -60), body.position);
      } else if (type === 'freeze') {
        buddyState.isFrozen = true;
        buddyState.freezeTimer = 7.0;
        playSound('freeze');
        updateStatusBadge('Frozen Solid');
        // Slow down velocity immediately
        dummyBodies.forEach(b => {
          b.velocity.scale(0.05, b.velocity);
          b.angularVelocity.scale(0.05, b.angularVelocity);
        });
      } else if (type === 'lightning') {
        buddyState.isElectrified = true;
        buddyState.zapTimer = 6.0;
        playSound('zap');
        updateStatusBadge('Shocked / Spasming');
        // Violent spasms
        dummyBodies.forEach(b => {
          b.applyImpulse(new CANNON.Vec3((Math.random() - 0.5) * 350, Math.random() * 300, (Math.random() - 0.5) * 350), b.position);
        });
      } else if (type === 'growth') {
        buddyState.scale = Math.min(buddyState.scale * 1.35, 2.5);
        updateStatusBadge('Giant Buddy (' + buddyState.scale.toFixed(1) + 'x)');
        playSound('hit');
        dummyMeshes.forEach(m => m.scale.set(buddyState.scale, buddyState.scale, buddyState.scale));
      } else if (type === 'death') {
        // Black Syringe: Insta-knockout ragdoll limp
        updateStatusBadge('Knocked Out');
        playSound('hit');
        dummyBodies.forEach(b => {
          b.mass = 2.0;
          b.updateMassProperties();
        });
      } else if (type === 'regen') {
        // Antidote / Healing: Restore normal state
        buddyState.isBurning = false;
        buddyState.burnTimer = 0;
        buddyState.isAcidMelting = false;
        buddyState.acidTimer = 0;
        buddyState.isFrozen = false;
        buddyState.freezeTimer = 0;
        buddyState.isElectrified = false;
        buddyState.zapTimer = 0;
        buddyState.scale = 1.0;
        dummyMeshes.forEach(m => m.scale.set(1, 1, 1));
        updateStatusBadge('Healed / Normal');
        playSound('heal');
        spawnSparks(pt.x, pt.y, pt.z, 30, [0.1, 1.0, 0.4]);
      }

      addImpactScore(350);
    }

    function updateSyringes(dt) {
      for (let i = activeSyringes.length - 1; i >= 0; i--) {
        const s = activeSyringes[i];
        s.life -= dt;
        if (s.life <= 0) {
          scene.remove(s.mesh);
          activeSyringes.splice(i, 1);
          continue;
        }

        // Stick to limb position & orientation
        const targetWorldPt = new CANNON.Vec3();
        s.targetBody.pointToWorldFrame(s.localOffset, targetWorldPt);
        s.mesh.position.set(targetWorldPt.x, targetWorldPt.y, targetWorldPt.z);
      }
    }

    /* ============================================================
       7. WEATHER SYSTEM (Acid Rain, Firestorm, Thunderstorm, Blizzard, Clear)
       ============================================================ */
    let currentWeather = 'clear';
    const weatherParticles = [];
    const weatherGeo = new THREE.BufferGeometry();
    const weatherCount = 500;
    const weatherPositions = new Float32Array(weatherCount * 3);
    const weatherColors = new Float32Array(weatherCount * 3);
    weatherGeo.setAttribute('position', new THREE.BufferAttribute(weatherPositions, 3));
    weatherGeo.setAttribute('color', new THREE.BufferAttribute(weatherColors, 3));

    const weatherMat = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });
    const weatherSystem = new THREE.Points(weatherGeo, weatherMat);
    scene.add(weatherSystem);

    for (let i = 0; i < weatherCount; i++) {
      weatherPositions[i * 3 + 0] = (Math.random() - 0.5) * 16;
      weatherPositions[i * 3 + 1] = Math.random() * 12;
      weatherPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;
      weatherColors[i * 3 + 0] = 1.0;
      weatherColors[i * 3 + 1] = 1.0;
      weatherColors[i * 3 + 2] = 1.0;
    }

    const acidOverlay = document.getElementById('acid-overlay');
    function setWeather(weather) {
      currentWeather = weather;
      document.getElementById('weather-text').innerText = weather.toUpperCase();
      nativeVibrate('medium');

      if (weather === 'clear') {
        scene.fog.color.setHex(0x131924);
        scene.background.setHex(0x131924);
        acidOverlay.style.opacity = '0';
      } else if (weather === 'acid_rain') {
        scene.fog.color.setHex(0x112811);
        scene.background.setHex(0x112811);
        acidOverlay.style.opacity = '0.45';
        playSound('acid');
      } else if (weather === 'firestorm') {
        scene.fog.color.setHex(0x2a1005);
        scene.background.setHex(0x2a1005);
        acidOverlay.style.opacity = '0';
        playSound('fire');
      } else if (weather === 'thunderstorm') {
        scene.fog.color.setHex(0x0a0e17);
        scene.background.setHex(0x0a0e17);
        acidOverlay.style.opacity = '0';
        playSound('thunder');
      } else if (weather === 'blizzard') {
        scene.fog.color.setHex(0x1c2b3d);
        scene.background.setHex(0x1c2b3d);
        acidOverlay.style.opacity = '0';
        playSound('freeze');
      }
    }

    function updateWeather(dt) {
      if (currentWeather === 'clear') {
        weatherSystem.visible = false;
        return;
      }
      weatherSystem.visible = true;

      const pos = weatherGeo.attributes.position;
      const col = weatherGeo.attributes.color;

      for (let i = 0; i < weatherCount; i++) {
        let y = pos.getY(i) - (currentWeather === 'blizzard' ? 5 : 18) * dt;
        let x = pos.getX(i);
        let z = pos.getZ(i);

        if (y < 0) {
          y = 12;
          x = (Math.random() - 0.5) * 16;
          z = (Math.random() - 0.5) * 10;

          // Weather impact on dummy on ground collision
          if (Math.random() < 0.05 && dummyBodies.length > 0) {
            const randomLimb = dummyBodies[Math.floor(Math.random() * dummyBodies.length)];
            if (currentWeather === 'acid_rain') {
              buddyState.isAcidMelting = true;
              buddyState.acidTimer = Math.max(buddyState.acidTimer, 3.0);
              spawnSparks(randomLimb.position.x, randomLimb.position.y, randomLimb.position.z, 4, [0.2, 1.0, 0.1]);
            } else if (currentWeather === 'firestorm') {
              buddyState.isBurning = true;
              buddyState.burnTimer = Math.max(buddyState.burnTimer, 3.0);
              spawnSparks(randomLimb.position.x, randomLimb.position.y, randomLimb.position.z, 4, [1.0, 0.4, 0.0]);
            }
          }
        }
        pos.setXYZ(i, x, y, z);

        if (currentWeather === 'acid_rain') {
          col.setXYZ(i, 0.2, 1.0, 0.2); // Green
        } else if (currentWeather === 'firestorm') {
          col.setXYZ(i, 1.0, 0.35 + Math.random() * 0.3, 0.05); // Fire ember
        } else if (currentWeather === 'blizzard') {
          col.setXYZ(i, 0.85, 0.95, 1.0); // Snowflake
        } else if (currentWeather === 'thunderstorm') {
          col.setXYZ(i, 0.3, 0.7, 1.0); // Heavy blue rain
        }
      }
      pos.needsUpdate = true;
      col.needsUpdate = true;

      // Random lightning strike in thunderstorm
      if (currentWeather === 'thunderstorm' && Math.random() < 0.008) {
        triggerLightningStrike();
      }
    }

    function triggerLightningStrike() {
      flashScreen();
      playSound('thunder');
      nativeVibrate('heavy');
      addTrauma(0.5);

      if (dummyBodies.length > 0) {
        const limb = dummyBodies[Math.floor(Math.random() * dummyBodies.length)];
        limb.applyImpulse(new CANNON.Vec3((Math.random() - 0.5) * 400, 350, (Math.random() - 0.5) * 350), limb.position);
        buddyState.isElectrified = true;
        buddyState.zapTimer = 4.0;
        updateStatusBadge('Lightning Struck!');
        spawnSparks(limb.position.x, limb.position.y, limb.position.z, 40, [1.0, 1.0, 0.3]);
      }
    }

    /* ============================================================
       8. PARTICLES & JUICE
       ============================================================ */
    const particles = [];
    const pGeo = new THREE.BufferGeometry();
    const pCount = 250;
    const pPositions = new Float32Array(pCount * 3);
    const pColors = new Float32Array(pCount * 3);
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

    const pMat = new THREE.PointsMaterial({
      size: 0.24,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    function spawnSparks(x, y, z, count = 20, colorOverride = null) {
      for (let i = 0; i < count; i++) {
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 8,
          Math.random() * 8 + 1,
          (Math.random() - 0.5) * 8
        );
        particles.push({
          pos: new THREE.Vector3(x, y, z),
          vel: vel,
          life: 1.0,
          decay: Math.random() * 0.04 + 0.02,
          color: colorOverride || [1.0, 0.85, 0.2]
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.pos.addScaledVector(p.vel, 0.016);
        p.vel.y -= 0.25; // gravity
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      const posAttr = pGeo.attributes.position;
      const colAttr = pGeo.attributes.color;
      for (let i = 0; i < pCount; i++) {
        if (i < particles.length) {
          const p = particles[i];
          posAttr.setXYZ(i, p.pos.x, p.pos.y, p.pos.z);
          colAttr.setXYZ(i, p.color[0] * p.life, p.color[1] * p.life, p.color[2] * p.life);
        } else {
          posAttr.setXYZ(i, 0, -999, 0);
        }
      }
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
    }

    let trauma = 0;
    function addTrauma(amount) {
      trauma = Math.min(trauma + amount, 1.0);
    }
    function updateCameraShake() {
      if (trauma > 0) {
        const shake = trauma * trauma;
        camera.position.x = (Math.random() - 0.5) * 0.35 * shake;
        camera.position.y = 4.4 + (Math.random() - 0.5) * 0.35 * shake;
        trauma = Math.max(0, trauma - 0.035);
      } else {
        camera.position.x = 0;
        camera.position.y = 4.4;
      }
    }

    /* ============================================================
       9. GAMEPLAY STATE & SCORE
       ============================================================ */
    let currentScore = 0;
    let isZeroG = false;
    let isSlowMo = false;
    let activeTool = 'grab'; // Default tool

    const scoreEl = document.getElementById('score');
    const speedValEl = document.getElementById('speed-val');
    const flashEl = document.getElementById('flash-overlay');
    const statusTextEl = document.getElementById('buddy-status-text');

    function flashScreen() {
      flashEl.style.opacity = '0.35';
      setTimeout(() => flashEl.style.opacity = '0', 70);
    }

    function updateStatusBadge(text) {
      statusTextEl.innerText = text;
    }

    function addImpactScore(pts) {
      currentScore += pts;
      scoreEl.innerText = currentScore.toLocaleString();
      scoreEl.classList.remove('score-bounce');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('score-bounce');
    }

    function createHitPopup(text, screenX, screenY) {
      const pop = document.createElement('div');
      pop.className = 'hit-popup';
      pop.innerText = text;
      pop.style.left = screenX + 'px';
      pop.style.top = screenY + 'px';
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 750);
    }

    function handleLimbImpact(pos, velocity) {
      const pts = Math.round(velocity * 75);
      addImpactScore(pts);

      if (velocity > 12) {
        nativeVibrate('heavy');
        playSound('hit');
        addTrauma(0.35);
      } else {
        nativeVibrate('light');
        playSound('hit');
        addTrauma(0.12);
      }

      spawnSparks(pos.x, pos.y, pos.z, Math.min(25, Math.floor(velocity * 2)));

      const v = new THREE.Vector3(pos.x, pos.y, pos.z).project(camera);
      const sx = (v.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
      createHitPopup('+' + pts, sx, sy);
    }

    /* ============================================================
       10. PIT / POOL INTERACTION LOGIC
       ============================================================ */
    function checkPitInteractions(dt) {
      if (currentPitType === 'none' || dummyBodies.length === 0) return;

      const pitRadius = 2.1;
      const pitX = 0, pitZ = 0.5;

      for (let i = 0; i < dummyBodies.length; i++) {
        const b = dummyBodies[i];
        const dx = b.position.x - pitX;
        const dz = b.position.z - pitZ;
        const dist = Math.sqrt(dx * dx + dz * dz);

        // If body limb is inside the pit zone and near floor
        if (dist < pitRadius && b.position.y < 0.9) {
          if (currentPitType === 'fire') {
            buddyState.isBurning = true;
            buddyState.burnTimer = 6.0;
            updateStatusBadge('In Fire Pit!');
            spawnSparks(b.position.x, b.position.y, b.position.z, 3, [1.0, 0.4, 0.0]);
            b.applyForce(new CANNON.Vec3(0, 80, 0), b.position); // Thermal updraft
            if (Math.random() < 0.1) playSound('fire');
          } else if (currentPitType === 'acid') {
            buddyState.isAcidMelting = true;
            buddyState.acidTimer = 6.0;
            updateStatusBadge('Melting in Acid!');
            spawnSparks(b.position.x, b.position.y, b.position.z, 3, [0.3, 1.0, 0.1]);
            // Acid dissolves velocity
            b.velocity.scale(0.85, b.velocity);
            if (Math.random() < 0.1) playSound('acid');
          } else if (currentPitType === 'pool') {
            // Water pool: buoyancy & damping
            b.velocity.scale(0.82, b.velocity); // Water drag
            b.applyForce(new CANNON.Vec3(0, 180, 0), b.position); // Buoyancy floating
            spawnSparks(b.position.x, b.position.y, b.position.z, 2, [0.3, 0.7, 1.0]);
            // Pool extinguishes fire!
            if (buddyState.isBurning) {
              buddyState.isBurning = false;
              buddyState.burnTimer = 0;
              updateStatusBadge('Fire Extinguished!');
              playSound('splash');
            }
          }
        }
      }
    }

    /* ============================================================
       11. CONTINUOUS CONDITIONS (Burning, Acid, Freeze, Electric)
       ============================================================ */
    function updateBuddyConditions(dt) {
      if (buddyState.isBurning) {
        buddyState.burnTimer -= dt;
        if (dummyBodies.length > 0 && Math.random() < 0.3) {
          const limb = dummyBodies[Math.floor(Math.random() * dummyBodies.length)];
          spawnSparks(limb.position.x, limb.position.y, limb.position.z, 6, [1.0, 0.3 + Math.random()*0.3, 0.0]);
          addImpactScore(15);
        }
        if (buddyState.burnTimer <= 0) {
          buddyState.isBurning = false;
          updateStatusBadge('Normal');
        }
      }

      if (buddyState.isAcidMelting) {
        buddyState.acidTimer -= dt;
        if (dummyBodies.length > 0 && Math.random() < 0.3) {
          const limb = dummyBodies[Math.floor(Math.random() * dummyBodies.length)];
          spawnSparks(limb.position.x, limb.position.y, limb.position.z, 5, [0.3, 1.0, 0.2]);
          addImpactScore(20);
        }
        if (buddyState.acidTimer <= 0) {
          buddyState.isAcidMelting = false;
          updateStatusBadge('Normal');
        }
      }

      if (buddyState.isFrozen) {
        buddyState.freezeTimer -= dt;
        // Keep limbs stiffened while frozen
        dummyBodies.forEach(b => {
          b.velocity.scale(0.88, b.velocity);
          b.angularVelocity.scale(0.88, b.angularVelocity);
        });
        if (buddyState.freezeTimer <= 0) {
          buddyState.isFrozen = false;
          playSound('freeze');
          updateStatusBadge('Thawed Out');
        }
      }

      if (buddyState.isElectrified) {
        buddyState.zapTimer -= dt;
        if (dummyBodies.length > 0 && Math.random() < 0.35) {
          const limb = dummyBodies[Math.floor(Math.random() * dummyBodies.length)];
          limb.applyImpulse(new CANNON.Vec3((Math.random() - 0.5) * 140, Math.random() * 120, (Math.random() - 0.5) * 140), limb.position);
          spawnSparks(limb.position.x, limb.position.y, limb.position.z, 8, [1.0, 1.0, 0.4]);
          addImpactScore(25);
        }
        if (buddyState.zapTimer <= 0) {
          buddyState.isElectrified = false;
          updateStatusBadge('Normal');
        }
      }
    }

    /* ============================================================
       12. INTERACTIVE DRAG PHYSICS & TOOL INTERACTIONS
       ============================================================ */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isInteracting = false;
    let draggedBody = null;
    let mouseConstraint = null;

    const planeMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    scene.add(planeMesh);

    const jointMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true })
    );
    jointMarker.visible = false;
    scene.add(jointMarker);

    const dummyJointBody = new CANNON.Body({ mass: 0 });
    world.addBody(dummyJointBody);

    function getIntersectedPoint(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      planeMesh.position.set(0, 0, 0);
      planeMesh.quaternion.copy(camera.quaternion);
      const intersects = raycaster.intersectObject(planeMesh);
      return intersects.length > 0 ? intersects[0].point : null;
    }

    function onPointerDown(e) {
      if (e.target.closest('#hud-top') || e.target.closest('#dock-container')) return;
      isInteracting = true;

      const rect = renderer.domElement.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(dummyMeshes);

      // Check if user clicked Buddy directly
      if (hits.length > 0) {
        const hitMesh = hits[0].object;
        const hitBody = dummyBodies.find(b => b.meshRef === hitMesh);
        const hitPt = hits[0].point;

        // If tool is a Syringe -> Inject into limb
        if (activeTool.startsWith('syr_')) {
          const syrType = activeTool.replace('syr_', '');
          injectSyringeAt(hitBody, hitPt, syrType);
          return;
        }

        // If tool is an element trigger (Flamethrower, Freeze beam, Lightning strike, Acid splash)
        if (activeTool === 'elem_flame') {
          triggerFlameBlast(hitPt);
          return;
        } else if (activeTool === 'elem_frost') {
          triggerFrostBlast(hitPt);
          return;
        } else if (activeTool === 'elem_tesla') {
          triggerTeslaZap(hitPt);
          return;
        } else if (activeTool === 'elem_acid') {
          triggerAcidSplash(hitPt);
          return;
        }

        // Tool is grab (or fallback grab): Pick up & throw Buddy
        if (hitBody) {
          draggedBody = hitBody;
          dummyJointBody.position.set(hitPt.x, hitPt.y, hitPt.z);
          mouseConstraint = new CANNON.PointToPointConstraint(
            hitBody,
            hitBody.pointToLocalFrame(new CANNON.Vec3(hitPt.x, hitPt.y, hitPt.z)),
            dummyJointBody,
            new CANNON.Vec3(0, 0, 0)
          );
          world.addConstraint(mouseConstraint);
          jointMarker.position.copy(hitPt);
          jointMarker.visible = true;
          nativeVibrate('light');
        }
      } else {
        // Clicked empty air: If elemental tool active, cast towards raycast intersection
        const emptyPt = getIntersectedPoint(e);
        if (emptyPt) {
          if (activeTool === 'elem_flame') triggerFlameBlast(emptyPt);
          else if (activeTool === 'elem_frost') triggerFrostBlast(emptyPt);
          else if (activeTool === 'elem_tesla') triggerTeslaZap(emptyPt);
          else if (activeTool === 'elem_acid') triggerAcidSplash(emptyPt);
        }
      }
    }

    function onPointerMove(e) {
      if (!isInteracting) return;
      const pt = getIntersectedPoint(e);
      if (pt && mouseConstraint) {
        dummyJointBody.position.set(pt.x, pt.y, pt.z);
        jointMarker.position.copy(pt);
      }
    }

    function onPointerUp() {
      isInteracting = false;
      if (mouseConstraint) {
        world.removeConstraint(mouseConstraint);
        mouseConstraint = null;
      }
      draggedBody = null;
      jointMarker.visible = false;
    }

    /* ============================================================
       13. ELEMENTAL ACTION FX
       ============================================================ */
    function triggerFlameBlast(targetPt) {
      playSound('fire');
      nativeVibrate('medium');
      addTrauma(0.2);
      spawnSparks(targetPt.x, targetPt.y, targetPt.z, 35, [1.0, 0.4, 0.05]);

      dummyBodies.forEach(b => {
        const dist = b.position.distanceTo(new CANNON.Vec3(targetPt.x, targetPt.y, targetPt.z));
        if (dist < 2.5) {
          buddyState.isBurning = true;
          buddyState.burnTimer = 8.0;
          updateStatusBadge('Torched!');
          b.applyImpulse(new CANNON.Vec3(0, 160, -80), b.position);
        }
      });
    }

    function triggerFrostBlast(targetPt) {
      playSound('freeze');
      nativeVibrate('light');
      addTrauma(0.15);
      spawnSparks(targetPt.x, targetPt.y, targetPt.z, 30, [0.5, 0.9, 1.0]);

      dummyBodies.forEach(b => {
        const dist = b.position.distanceTo(new CANNON.Vec3(targetPt.x, targetPt.y, targetPt.z));
        if (dist < 2.5) {
          buddyState.isFrozen = true;
          buddyState.freezeTimer = 7.0;
          updateStatusBadge('Frozen Ice!');
        }
      });
    }

    function triggerTeslaZap(targetPt) {
      playSound('zap');
      nativeVibrate('heavy');
      addTrauma(0.3);

      // Visual lightning arc line
      const lineMat = new THREE.LineBasicMaterial({ color: 0xffea00, linewidth: 4 });
      const points = [
        new THREE.Vector3(camera.position.x + 1, camera.position.y - 1, camera.position.z),
        new THREE.Vector3(targetPt.x, targetPt.y, targetPt.z)
      ];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(lineGeo, lineMat);
      scene.add(line);
      setTimeout(() => scene.remove(line), 100);

      spawnSparks(targetPt.x, targetPt.y, targetPt.z, 35, [1.0, 1.0, 0.2]);

      dummyBodies.forEach(b => {
        const dist = b.position.distanceTo(new CANNON.Vec3(targetPt.x, targetPt.y, targetPt.z));
        if (dist < 2.2) {
          buddyState.isElectrified = true;
          buddyState.zapTimer = 6.0;
          updateStatusBadge('Electrocuted!');
          b.applyImpulse(new CANNON.Vec3((Math.random() - 0.5) * 350, 280, (Math.random() - 0.5) * 300), b.position);
        }
      });
    }

    function triggerAcidSplash(targetPt) {
      playSound('acid');
      nativeVibrate('medium');
      spawnSparks(targetPt.x, targetPt.y, targetPt.z, 30, [0.3, 1.0, 0.1]);

      dummyBodies.forEach(b => {
        const dist = b.position.distanceTo(new CANNON.Vec3(targetPt.x, targetPt.y, targetPt.z));
        if (dist < 2.2) {
          buddyState.isAcidMelting = true;
          buddyState.acidTimer = 7.0;
          updateStatusBadge('Acid Burned!');
          b.applyImpulse(new CANNON.Vec3(0, 100, -60), b.position);
        }
      });
    }

    /* ============================================================
       14. UI CATEGORY & WEAPON DOCK MANAGEMENT
       ============================================================ */

        { id: 'grab', icon: '🖐️', label: 'Grab' },
        { id: 'syr_acid', icon: '🧪', label: 'Acid Syr' },

        { id: 'syr_regen', icon: '💉', label: 'Antidote' }

      ],

        { id: 'elem_flame', icon: '🔥', label: 'Flame Gun' },
        { id: 'elem_frost', icon: '❄️', label: 'Freeze Ray' },
        { id: 'elem_tesla', icon: '⚡', label: 'Tesla Zap' },

      ]
    };

    const weaponBar = document.getElementById('weapon-bar');
    const pitSelector = document.getElementById('pit-selector');

    function renderWeaponBar(catKey) {
      weaponBar.innerHTML = '';
      const list = categoryTools[catKey] || categoryTools.syringes;

      pitSelector.style.display = (catKey === 'pits') ? 'flex' : 'none';

      list.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'tool-btn' + (activeTool === item.id ? ' active' : '');
        btn.setAttribute('data-tool', item.id);
        btn.innerHTML = `<span class="icon">${item.icon}</span><span>${item.label}</span>`;

        btn.addEventListener('click', () => {
          initAudio();
          nativeVibrate('light');

          if (item.id === 'pit_fire') { setPit('fire'); return; }
          if (item.id === 'pit_acid') { setPit('acid'); return; }
          if (item.id === 'pit_pool') { setPit('pool'); return; }
          if (item.id === 'pit_none') { setPit('none'); return; }

          if (item.id === 'wea_clear') { setWeather('clear'); return; }
          if (item.id === 'wea_acid') { setWeather('acid_rain'); return; }
          if (item.id === 'wea_fire') { setWeather('firestorm'); return; }
          if (item.id === 'wea_thunder') { setWeather('thunderstorm'); return; }
          if (item.id === 'wea_blizzard') { setWeather('blizzard'); return; }

          document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeTool = item.id;
        });

        weaponBar.appendChild(btn);
      });
    }

    // Tab buttons
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        initAudio();
        nativeVibrate('light');
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const cat = tab.getAttribute('data-cat');
        renderWeaponBar(cat);
      });
    });

    // Subcategory Pit Selector Buttons
    document.querySelectorAll('.pit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pit = btn.getAttribute('data-pit');
        setPit(pit);
      });
    });

    renderWeaponBar('syringes');

    // Pointer events binding
    const dom = renderer.domElement;
    dom.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    dom.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);
    window.addEventListener('touchcancel', onPointerUp);

    // Side Action Buttons
    document.getElementById('btn-reset').addEventListener('click', () => {
      initAudio();
      nativeVibrate('medium');
      playSound('heal');
      buildBuddyRagdoll(0, 4.0, 0);
    });

    const gravBtn = document.getElementById('btn-gravity');
    gravBtn.addEventListener('click', () => {
      initAudio();
      isZeroG = !isZeroG;
      world.gravity.set(0, isZeroG ? -0.5 : -18, 0);
      gravBtn.innerHTML = isZeroG ? '<span>🛸</span> Normal G' : '<span>🌍</span> Zero G';
      nativeVibrate('medium');
    });

    const slowBtn = document.getElementById('btn-slowmo');
    slowBtn.addEventListener('click', () => {
      initAudio();
      isSlowMo = !isSlowMo;
      slowBtn.innerHTML = isSlowMo ? '<span>⚡</span> Normal' : '<span>⏱️</span> Slow-Mo';
      slowBtn.style.color = isSlowMo ? '#00e5ff' : '#cfd8dc';
      nativeVibrate('medium');
    });

    /* ============================================================
       15. IN-APP UPDATE SYSTEM
       ============================================================ */
    const updateModal = document.getElementById('update-modal');
    const updateTitle = document.getElementById('update-title');
    const updateDesc = document.getElementById('update-desc');
    const updateConfirmBtn = document.getElementById('update-confirm-btn');
    const updateCancelBtn = document.getElementById('update-cancel-btn');
    let pendingDownloadUrl = null;

    document.getElementById('btn-update').addEventListener('click', () => {
      initAudio();
      nativeVibrate('light');
      if (window.AndroidNative && window.AndroidNative.checkForUpdates) {
        window.AndroidNative.checkForUpdates();
      } else {
        alert('Check for updates is active when running inside the Android APK.');
      }
    });

    window.onUpdateResult = function(event, version, downloadUrl) {
      if (event === 'updateAvailable') {
        pendingDownloadUrl = downloadUrl;
        updateTitle.innerText = 'New Update (v' + version + ')';
        updateDesc.innerText = 'A newer version of Kick Buddy 3D is available on GitHub. Would you like to install it now?';
        updateModal.style.display = 'flex';
      }
    };

    updateCancelBtn.addEventListener('click', () => {
      updateModal.style.display = 'none';
    });

    updateConfirmBtn.addEventListener('click', () => {
      updateModal.style.display = 'none';
      if (pendingDownloadUrl && window.AndroidNative && window.AndroidNative.downloadAndInstallUpdate) {
        window.AndroidNative.downloadAndInstallUpdate(pendingDownloadUrl);
      }
    });

    /* ============================================================
       16. MAIN ANIMATION & PHYSICS GAME LOOP
       ============================================================ */
    let lastTime = performance.now();
    function animate(time) {
      requestAnimationFrame(animate);

      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      // Physics step
      const stepDt = isSlowMo ? dt * 0.3 : dt;
      world.step(1 / 60, stepDt, 4);

      // Sync Buddy Bodies to Meshes
      let maxSpeed = 0;
      for (let i = 0; i < dummyBodies.length; i++) {
        const body = dummyBodies[i];
        const mesh = dummyMeshes[i];
        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
        const speed = body.velocity.length();
        if (speed > maxSpeed) maxSpeed = speed;
      }
      speedValEl.innerText = maxSpeed.toFixed(1) + ' m/s';

      // Update Subsystems
      updateSyringes(stepDt);
      checkPitInteractions(stepDt);
      updateBuddyConditions(stepDt);
      updateWeather(stepDt);
      updateParticles();
      updateCameraShake();

      // Liquid wave animation in pit if active
      if (pitLiquidMesh && pitMeshGroup.visible) {
        pitLiquidMesh.position.y = 0.22 + Math.sin(time * 0.004) * 0.04;
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
