<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crash Dummy 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Top HUD */
    #hud-top {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 10px 16px;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .score-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff9800;
    }
    .score-value {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 152, 0, 0.6);
      transition: transform 0.1s ease;
    }
    .score-bounce {
      transform: scale(1.25);
      color: #ffeb3b;
    }

    .stat-row {
      display: flex;
      gap: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #90a4ae;
    }
    .stat-val {
      color: #00e5ff;
      font-weight: 700;
    }

    /* Floating Hit Text */
    .hit-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      font-size: 22px;
      transform: translate(-50%, -50%);
      color: #ffeb3b;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 87, 34, 0.8);
      animation: popFade 0.75s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      z-index: 50;
    }
    @keyframes popFade {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
      20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -60px) scale(0.9); }
    }

    /* Quick Action Controls on Left/Right */
    .side-btn {
      pointer-events: auto;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      color: #cfd8dc;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.15s, transform 0.1s;
    }
    .side-btn:active {
      transform: scale(0.94);
      background: rgba(255, 87, 34, 0.4);
    }

    /* Bottom Weapon Dock */
    #weapon-bar-container {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    #weapon-bar {
      display: flex;
      gap: 8px;
      background: rgba(13, 17, 23, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: auto;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #weapon-bar::-webkit-scrollbar {
      display: none;
    }
    .tool-btn {
      flex: 0 0 auto;
      min-width: 58px;
      height: 58px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .tool-btn .icon {
      font-size: 22px;
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .tool-btn.active {
      background: linear-gradient(135deg, #ff6b35, #ff3b00);
      border-color: #ffeb3b;
      color: #ffffff;
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 6px 16px rgba(255, 87, 34, 0.5);
    }
    .tool-btn:active {
      transform: scale(0.92);
    }

    #tip-banner {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-weight: 600;
      background: rgba(0,0,0,0.4);
      padding: 4px 12px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }

    /* Screen Flash FX */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: white;
      opacity: 0;
      z-index: 100;
      transition: opacity 0.08s ease-out;
    }
  </style>
  <script src="libs/engine.bundle.js"></script>
</head>
<body>
  <div id="flash-overlay"></div>
  <div id="canvas-container"></div>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-card">
      <div class="score-label">IMPACT SCORE</div>
      <div id="score" class="score-value">0</div>
      <div class="stat-row">
        <span>HITS: <span id="hit-count" class="stat-val">0</span></span>
        <span>VEL: <span id="speed-val" class="stat-val">0.0 m/s</span></span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="side-btn" id="btn-update">
        <span>🔄</span> Check Update
      </button>
      <button class="side-btn" id="btn-reset">
        <span>🔄</span> Reset
      </button>
      <button class="side-btn" id="btn-gravity">
        <span>🌍</span> Zero G
      </button>
      <button class="side-btn" id="btn-slowmo">
        <span>⏱️</span> Slow-Mo
      </button>
    </div>
  </div>

  <!-- Update Modal -->
  <div id="update-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:200; justify-content:center; align-items:center;">
    <div style="background:#161b22; border:1px solid #30363d; border-radius:18px; padding:24px; max-width:320px; width:85%; color:#fff; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.8);">
      <div style="font-size:36px; margin-bottom:10px;">🚀</div>
      <div style="font-size:18px; font-weight:800; margin-bottom:8px;" id="update-title">Update Available!</div>
      <div style="font-size:13px; color:#8b949e; margin-bottom:20px;" id="update-desc">A new version of Crash Dummy 3D is available on GitHub.</div>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button id="update-cancel-btn" style="background:#21262d; border:1px solid #30363d; color:#c9d1d9; padding:10px 16px; border-radius:10px; font-weight:700; cursor:pointer;">Later</button>
        <button id="update-confirm-btn" style="background:linear-gradient(135deg, #238636, #2ea043); border:none; color:#fff; padding:10px 18px; border-radius:10px; font-weight:700; cursor:pointer;">Install Now</button>
      </div>
    </div>
  </div>

  <!-- Weapon / Tool selector -->
  <div id="weapon-bar-container">
    <div id="tip-banner">Tap & drag to grab dummy limb | Select a tool to unleash chaos</div>
    <div id="weapon-bar">
      <button class="tool-btn active" data-tool="hand">
        <span class="icon">🖐️</span>
        <span>Grab</span>
      </button>
      <button class="tool-btn" data-tool="bat">
        <span class="icon">🏏</span>
        <span>Bat</span>
      </button>
      <button class="tool-btn" data-tool="bomb">
        <span class="icon">💣</span>
        <span>Bomb</span>
      </button>
      <button class="tool-btn" data-tool="cannon">
        <span class="icon">🚀</span>
        <span>Rocket</span>
      </button>
      <button class="tool-btn" data-tool="glove">
        <span class="icon">🥊</span>
        <span>Punch</span>
      </button>
      <button class="tool-btn" data-tool="laser">
        <span class="icon">⚡</span>
        <span>Laser</span>
      </button>
    </div>
  </div>

  <script>
    // Audio synthesizer (Procedural Web Audio API for zero-lag juicy punches/explosions)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160 + Math.random() * 80, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'punch') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.22);
        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === 'explosion') {
        // White noise burst
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(80, now + 0.35);

        const expGain = audioCtx.createGain();
        expGain.gain.setValueAtTime(1.0, now);
        expGain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);

        noise.connect(filter);
        filter.connect(expGain);
        expGain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.18);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      }
    }

    function nativeVibrate(type) {
      if (window.AndroidNative && window.AndroidNative.vibrate) {
        window.AndroidNative.vibrate(type);
      } else if (navigator.vibrate) {
        if (type === 'light') navigator.vibrate(15);
        else if (type === 'heavy') navigator.vibrate(60);
        else if (type === 'explosion') navigator.vibrate([40, 30, 80]);
        else navigator.vibrate(25);
      }
    }

    // -------------------------------------------------------------
    // THREE.JS & CANNON-ES SETUP
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e131f);
    scene.fog = new THREE.FogExp2(0x0e131f, 0.035);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.2, 11);
    camera.lookAt(0, 2.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff3e0, 1.8);
    dirLight.position.set(5, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -6;
    dirLight.shadow.camera.right = 6;
    dirLight.shadow.camera.top = 8;
    dirLight.shadow.camera.bottom = -4;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    // Neon Rim Lights
    const rimLightBlue = new THREE.PointLight(0x00d9ff, 3.5, 15);
    rimLightBlue.position.set(-6, 3, 2);
    scene.add(rimLightBlue);

    const rimLightOrange = new THREE.PointLight(0xff5722, 3.5, 15);
    rimLightOrange.position.set(6, 4, -2);
    scene.add(rimLightOrange);

    // Physics World
    const world = new CANNON.World();
    world.gravity.set(0, -18, 0);
    world.solver.iterations = 10;
    world.defaultContactMaterial.friction = 0.4;
    world.defaultContactMaterial.restitution = 0.35;

    // Room Enclosure (Ground & Walls)
    function createGroundAndWalls() {
      // Floor
      const floorGeo = new THREE.PlaneGeometry(24, 24);
      // Procedural grid texture
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#181f2c';
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#273449';
      ctx.lineWidth = 4;
      for (let i = 0; i <= 512; i += 64) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, 512);
        ctx.moveTo(0, i); ctx.lineTo(512, i);
        ctx.stroke();
      }
      // Target bullseye circle in center of room
      ctx.strokeStyle = '#ff9800';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(256, 256, 120, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(256, 256, 60, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ff9800';
      ctx.beginPath(); ctx.arc(256, 256, 18, 0, Math.PI * 2); ctx.fill();

      const floorTex = new THREE.CanvasTexture(canvas);
      floorTex.wrapS = THREE.RepeatWrapping;
      floorTex.wrapT = THREE.RepeatWrapping;
      floorTex.repeat.set(2, 2);

      const floorMat = new THREE.MeshStandardMaterial({
        map: floorTex,
        roughness: 0.5,
        metalness: 0.2
      });
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      const floorBody = new CANNON.Body({
        mass: 0,
        shape: new CANNON.Plane()
      });
      floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      world.addBody(floorBody);

      // Hazard Back Wall
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x141b27, roughness: 0.7 });
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 16), wallMat);
      backWall.position.set(0, 8, -6);
      backWall.receiveShadow = true;
      scene.add(backWall);

      const backWallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      backWallBody.position.set(0, 8, -6);
      world.addBody(backWallBody);

      // Left & Right invisible boundary cushions
      const leftWallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      leftWallBody.position.set(-6.5, 5, 0);
      leftWallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
      world.addBody(leftWallBody);

      const rightWallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      rightWallBody.position.set(6.5, 5, 0);
      rightWallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -Math.PI / 2);
      world.addBody(rightWallBody);

      // Ceiling
      const ceilingBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
      ceilingBody.position.set(0, 12, 0);
      ceilingBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), Math.PI / 2);
      world.addBody(ceilingBody);
    }
    createGroundAndWalls();

    // -------------------------------------------------------------
    // CRASH TEST DUMMY RAGDOLL GENERATION
    // -------------------------------------------------------------
    // Crash dummy materials: iconic yellow body with black/white hazard markings
    const dummyMatYellow = new THREE.MeshStandardMaterial({
      color: 0xffb703,
      roughness: 0.35,
      metalness: 0.15
    });
    const dummyMatBlack = new THREE.MeshStandardMaterial({
      color: 0x1f242d,
      roughness: 0.5,
      metalness: 0.3
    });
    const dummyMatWhite = new THREE.MeshStandardMaterial({
      color: 0xf0f4f8,
      roughness: 0.4
    });

    // Crash target circle texture for head
    function createTargetTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const x = c.getContext('2d');
      x.fillStyle = '#ffb703';
      x.fillRect(0, 0, 256, 256);
      x.fillStyle = '#1a1e24';
      x.beginPath(); x.moveTo(128, 128); x.arc(128, 128, 100, 0, Math.PI / 2); x.fill();
      x.beginPath(); x.moveTo(128, 128); x.arc(128, 128, 100, Math.PI, Math.PI * 1.5); x.fill();
      x.strokeStyle = '#fff'; x.lineWidth = 6;
      x.beginPath(); x.arc(128, 128, 100, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.moveTo(28, 128); x.lineTo(228, 128); x.stroke();
      x.beginPath(); x.moveTo(128, 28); x.lineTo(128, 228); x.stroke();
      return new THREE.CanvasTexture(c);
    }
    const headMat = new THREE.MeshStandardMaterial({
      map: createTargetTexture(),
      roughness: 0.35,
      metalness: 0.2
    });

    let dummyBodies = [];
    let dummyMeshes = [];
    let dummyConstraints = [];

    function createDummyLimb(mesh, shape, mass, position) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.copy(position);
      scene.add(mesh);

      const body = new CANNON.Body({
        mass: mass,
        linearDamping: 0.25,
        angularDamping: 0.3
      });
      body.addShape(shape);
      body.position.set(position.x, position.y, position.z);
      world.addBody(body);

      // Tag body for hit identification
      body.isDummyLimb = true;
      body.meshRef = mesh;
      dummyBodies.push(body);
      dummyMeshes.push(mesh);

      // Collision sound & score tracking
      body.addEventListener('collide', function(e) {
        const relVel = e.contact.getImpactVelocityAlongNormal();
        if (relVel > 3.5) {
          handleLimbImpact(body.position, relVel);
        }
      });

      return body;
    }

    function buildRagdoll(startX = 0, startY = 3.8, startZ = 0) {
      // Clean previous
      dummyConstraints.forEach(c => world.removeConstraint(c));
      dummyConstraints = [];
      dummyBodies.forEach(b => world.removeBody(b));
      dummyBodies = [];
      dummyMeshes.forEach(m => scene.remove(m));
      dummyMeshes = [];

      // 1. Torso (Chest & Pelvis)
      const chestMesh = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.95, 0.5), dummyMatYellow);
      const chestBody = createDummyLimb(chestMesh, new CANNON.Box(new CANNON.Vec3(0.42, 0.47, 0.25)), 12, new THREE.Vector3(startX, startY + 0.65, startZ));

      const pelvisMesh = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.46), dummyMatBlack);
      const pelvisBody = createDummyLimb(pelvisMesh, new CANNON.Box(new CANNON.Vec3(0.37, 0.27, 0.23)), 10, new THREE.Vector3(startX, startY, startZ));

      // Spine Joint (Chest - Pelvis)
      const spineJoint = new CANNON.ConeTwistConstraint(chestBody, pelvisBody, {
        pivotA: new CANNON.Vec3(0, -0.47, 0),
        pivotB: new CANNON.Vec3(0, 0.27, 0),
        axisA: CANNON.Vec3.UNIT_Y,
        axisB: CANNON.Vec3.UNIT_Y,
        angle: Math.PI / 8,
        twistAngle: Math.PI / 10
      });
      world.addConstraint(spineJoint);
      dummyConstraints.push(spineJoint);

      // 2. Head
      const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 24), headMat);
      const headBody = createDummyLimb(headMesh, new CANNON.Sphere(0.38), 5, new THREE.Vector3(startX, startY + 1.45, startZ));

      // Neck Joint
      const neckJoint = new CANNON.ConeTwistConstraint(headBody, chestBody, {
        pivotA: new CANNON.Vec3(0, -0.38, 0),
        pivotB: new CANNON.Vec3(0, 0.52, 0),
        axisA: CANNON.Vec3.UNIT_Y,
        axisB: CANNON.Vec3.UNIT_Y,
        angle: Math.PI / 6,
        twistAngle: Math.PI / 8
      });
      world.addConstraint(neckJoint);
      dummyConstraints.push(neckJoint);

      // 3. Arms (Upper & Forearm)
      const armGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.6, 16);
      const foreArmGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.55, 16);

      // Left Arm
      const leftUpperArmMesh = new THREE.Mesh(armGeo, dummyMatYellow);
      const leftUpperArmBody = createDummyLimb(leftUpperArmMesh, new CANNON.Cylinder(0.14, 0.14, 0.6, 12), 3, new THREE.Vector3(startX - 0.72, startY + 0.65, startZ));
      const leftForearmMesh = new THREE.Mesh(foreArmGeo, dummyMatWhite);
      const leftForearmBody = createDummyLimb(leftForearmMesh, new CANNON.Cylinder(0.12, 0.12, 0.55, 12), 2.5, new THREE.Vector3(startX - 0.72, startY + 0.05, startZ));

      const leftShoulder = new CANNON.PointToPointConstraint(chestBody, new CANNON.Vec3(-0.52, 0.35, 0), leftUpperArmBody, new CANNON.Vec3(0, 0.3, 0));
      const leftElbow = new CANNON.PointToPointConstraint(leftUpperArmBody, new CANNON.Vec3(0, -0.3, 0), leftForearmBody, new CANNON.Vec3(0, 0.28, 0));
      world.addConstraint(leftShoulder);
      world.addConstraint(leftElbow);
      dummyConstraints.push(leftShoulder, leftElbow);

      // Right Arm
      const rightUpperArmMesh = new THREE.Mesh(armGeo, dummyMatYellow);
      const rightUpperArmBody = createDummyLimb(rightUpperArmMesh, new CANNON.Cylinder(0.14, 0.14, 0.6, 12), 3, new THREE.Vector3(startX + 0.72, startY + 0.65, startZ));
      const rightForearmMesh = new THREE.Mesh(foreArmGeo, dummyMatWhite);
      const rightForearmBody = createDummyLimb(rightForearmMesh, new CANNON.Cylinder(0.12, 0.12, 0.55, 12), 2.5, new THREE.Vector3(startX + 0.72, startY + 0.05, startZ));

      const rightShoulder = new CANNON.PointToPointConstraint(chestBody, new CANNON.Vec3(0.52, 0.35, 0), rightUpperArmBody, new CANNON.Vec3(0, 0.3, 0));
      const rightElbow = new CANNON.PointToPointConstraint(rightUpperArmBody, new CANNON.Vec3(0, -0.3, 0), rightForearmBody, new CANNON.Vec3(0, 0.28, 0));
      world.addConstraint(rightShoulder);
      world.addConstraint(rightElbow);
      dummyConstraints.push(rightShoulder, rightElbow);

      // 4. Legs (Thigh & Shin)
      const legGeo = new THREE.CylinderGeometry(0.18, 0.15, 0.75, 16);
      const shinGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.7, 16);

      // Left Leg
      const leftThighMesh = new THREE.Mesh(legGeo, dummyMatYellow);
      const leftThighBody = createDummyLimb(leftThighMesh, new CANNON.Cylinder(0.18, 0.15, 0.75, 12), 6, new THREE.Vector3(startX - 0.28, startY - 0.65, startZ));
      const leftShinMesh = new THREE.Mesh(shinGeo, dummyMatBlack);
      const leftShinBody = createDummyLimb(leftShinMesh, new CANNON.Cylinder(0.14, 0.12, 0.7, 12), 4, new THREE.Vector3(startX - 0.28, startY - 1.45, startZ));

      const leftHip = new CANNON.PointToPointConstraint(pelvisBody, new CANNON.Vec3(-0.25, -0.28, 0), leftThighBody, new CANNON.Vec3(0, 0.38, 0));
      const leftKnee = new CANNON.PointToPointConstraint(leftThighBody, new CANNON.Vec3(0, -0.38, 0), leftShinBody, new CANNON.Vec3(0, 0.35, 0));
      world.addConstraint(leftHip);
      world.addConstraint(leftKnee);
      dummyConstraints.push(leftHip, leftKnee);

      // Right Leg
      const rightThighMesh = new THREE.Mesh(legGeo, dummyMatYellow);
      const rightThighBody = createDummyLimb(rightThighMesh, new CANNON.Cylinder(0.18, 0.15, 0.75, 12), 6, new THREE.Vector3(startX + 0.28, startY - 0.65, startZ));
      const rightShinMesh = new THREE.Mesh(shinGeo, dummyMatBlack);
      const rightShinBody = createDummyLimb(rightShinMesh, new CANNON.Cylinder(0.14, 0.12, 0.7, 12), 4, new THREE.Vector3(startX + 0.28, startY - 1.45, startZ));

      const rightHip = new CANNON.PointToPointConstraint(pelvisBody, new CANNON.Vec3(0.25, -0.28, 0), rightThighBody, new CANNON.Vec3(0, 0.38, 0));
      const rightKnee = new CANNON.PointToPointConstraint(rightThighBody, new CANNON.Vec3(0, -0.38, 0), rightShinBody, new CANNON.Vec3(0, 0.35, 0));
      world.addConstraint(rightHip);
      world.addConstraint(rightKnee);
      dummyConstraints.push(rightHip, rightKnee);
    }
    buildRagdoll();

    // -------------------------------------------------------------
    // PARTICLES & JUICE
    // -------------------------------------------------------------
    const particles = [];
    const pGeo = new THREE.BufferGeometry();
    const pCount = 200;
    const pPositions = new Float32Array(pCount * 3);
    const pColors = new Float32Array(pCount * 3);
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

    const pMat = new THREE.PointsMaterial({
      size: 0.22,
      vertexColors: true,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    function spawnSparks(x, y, z, count = 20, isExplosion = false) {
      for (let i = 0; i < count; i++) {
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * (isExplosion ? 16 : 8),
          Math.random() * (isExplosion ? 14 : 7) + 2,
          (Math.random() - 0.5) * (isExplosion ? 16 : 8)
        );
        particles.push({
          pos: new THREE.Vector3(x, y, z),
          vel: vel,
          life: 1.0,
          decay: Math.random() * 0.04 + 0.02,
          color: isExplosion ? [1.0, 0.4 + Math.random()*0.4, 0.1] : [1.0, 0.85, 0.2]
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.pos.addScaledVector(p.vel, 0.016);
        p.vel.y -= 0.3; // gravity
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      const posAttr = pGeo.attributes.position;
      const colAttr = pGeo.attributes.color;
      let idx = 0;
      for (let i = 0; i < pCount; i++) {
        if (i < particles.length) {
          const p = particles[i];
          posAttr.setXYZ(i, p.pos.x, p.pos.y, p.pos.z);
          colAttr.setXYZ(i, p.color[0] * p.life, p.color[1] * p.life, p.color[2] * p.life);
        } else {
          posAttr.setXYZ(i, 0, -999, 0);
        }
      }
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
    }

    // Screen Shake
    let trauma = 0;
    function addTrauma(amount) {
      trauma = Math.min(trauma + amount, 1.0);
    }
    function updateCameraShake() {
      if (trauma > 0) {
        const shake = trauma * trauma;
        camera.position.x = (Math.random() - 0.5) * 0.4 * shake;
        camera.position.y = 4.2 + (Math.random() - 0.5) * 0.4 * shake;
        trauma = Math.max(0, trauma - 0.035);
      } else {
        camera.position.x = 0;
        camera.position.y = 4.2;
      }
    }

    // -------------------------------------------------------------
    // GAMEPLAY STATE & INTERACTIONS
    // -------------------------------------------------------------
    let currentScore = 0;
    let totalHits = 0;
    let activeTool = 'hand';
    let isZeroG = false;
    let isSlowMo = false;

    const scoreEl = document.getElementById('score');
    const hitCountEl = document.getElementById('hit-count');
    const speedValEl = document.getElementById('speed-val');
    const flashEl = document.getElementById('flash-overlay');

    function flashScreen() {
      flashEl.style.opacity = '0.35';
      setTimeout(() => flashEl.style.opacity = '0', 70);
    }

    function createHitPopup(text, screenX, screenY) {
      const pop = document.createElement('div');
      pop.className = 'hit-popup';
      pop.innerText = text;
      pop.style.left = screenX + 'px';
      pop.style.top = screenY + 'px';
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 750);
    }

    function handleLimbImpact(pos, velocity) {
      const pts = Math.round(velocity * 85);
      currentScore += pts;
      totalHits++;

      scoreEl.innerText = currentScore.toLocaleString();
      scoreEl.classList.remove('score-bounce');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('score-bounce');
      hitCountEl.innerText = totalHits;

      // Haptic & Sound
      if (velocity > 12) {
        nativeVibrate('heavy');
        playSound('punch');
        addTrauma(0.5);
      } else {
        nativeVibrate('light');
        playSound('hit');
        addTrauma(0.18);
      }

      spawnSparks(pos.x, pos.y, pos.z, Math.min(30, Math.floor(velocity * 2)));

      // 3D to 2D screen coordinate for hit popup
      const v = new THREE.Vector3(pos.x, pos.y, pos.z).project(camera);
      const sx = (v.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
      createHitPopup('+' + pts + ' PTS!', sx, sy);
    }

    // Interactive Drag Physics Mouse/Touch
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let draggedBody = null;
    let mouseConstraint = null;
    const planeMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    scene.add(planeMesh);

    // Mouse dummy joint marker
    const jointMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true })
    );
    jointMarker.visible = false;
    scene.add(jointMarker);

    function getIntersectedPoint(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      planeMesh.position.set(0, 0, 0);
      planeMesh.quaternion.copy(camera.quaternion);
      const intersects = raycaster.intersectObject(planeMesh);
      return intersects.length > 0 ? intersects[0].point : null;
    }

    // Dynamic Weapons
    function applyToolAction(e) {
      const pt = getIntersectedPoint(e);
      if (!pt) return;

      if (activeTool === 'bomb') {
        spawnExplosion(pt.x, pt.y, pt.z);
      } else if (activeTool === 'bat') {
        swingBat(pt);
      } else if (activeTool === 'cannon') {
        fireRocket(pt);
      } else if (activeTool === 'glove') {
        punchStrike(pt);
      } else if (activeTool === 'laser') {
        fireLaser(pt);
      }
    }

    function spawnExplosion(x, y, z) {
      flashScreen();
      playSound('explosion');
      nativeVibrate('explosion');
      addTrauma(0.8);
      spawnSparks(x, y, z, 70, true);

      // Radial impulse to all limbs
      dummyBodies.forEach(b => {
        const dx = b.position.x - x;
        const dy = b.position.y - y;
        const dz = b.position.z - z;
        const dist = Math.max(0.5, Math.sqrt(dx*dx + dy*dy + dz*dz));
        const force = 900 / (dist * dist);
        b.applyImpulse(
          new CANNON.Vec3((dx / dist) * force, (dy / dist) * force + 200, (dz / dist) * force),
          b.position
        );
      });
      handleLimbImpact(new CANNON.Vec3(x, y, z), 25);
    }

    function swingBat(targetPt) {
      playSound('punch');
      nativeVibrate('heavy');
      addTrauma(0.4);
      dummyBodies.forEach(b => {
        const dist = b.position.distanceTo(new CANNON.Vec3(targetPt.x, targetPt.y, targetPt.z));
        if (dist < 2.5) {
          const power = 350;
          b.applyImpulse(new CANNON.Vec3((Math.random() - 0.5) * power, power * 1.2, -power * 0.8), b.position);
          spawnSparks(b.position.x, b.position.y, b.position.z, 25);
        }
      });
    }

    function punchStrike(targetPt) {
      playSound('punch');
      nativeVibrate('medium');
      addTrauma(0.3);
      dummyBodies.forEach(b => {
        const dist = b.position.distanceTo(new CANNON.Vec3(targetPt.x, targetPt.y, targetPt.z));
        if (dist < 1.8) {
          b.applyImpulse(new CANNON.Vec3((b.position.x - targetPt.x) * 400, 300, -250), b.position);
          spawnSparks(b.position.x, b.position.y, b.position.z, 15);
        }
      });
    }

    function fireLaser(targetPt) {
      playSound('laser');
      nativeVibrate('light');

      // Visual laser line
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 4 });
      const points = [
        new THREE.Vector3(camera.position.x, camera.position.y - 1, camera.position.z),
        targetPt
      ];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(lineGeo, lineMat);
      scene.add(line);
      setTimeout(() => scene.remove(line), 90);

      dummyBodies.forEach(b => {
        const dist = b.position.distanceTo(new CANNON.Vec3(targetPt.x, targetPt.y, targetPt.z));
        if (dist < 1.2) {
          b.applyImpulse(new CANNON.Vec3(0, 180, -280), b.position);
          spawnSparks(targetPt.x, targetPt.y, targetPt.z, 20);
        }
      });
    }

    function fireRocket(targetPt) {
      playSound('laser');
      nativeVibrate('medium');
      setTimeout(() => {
        spawnExplosion(targetPt.x, targetPt.y, targetPt.z);
      }, 120);
    }

    // Pointer Events for Dragging & Grabbing
    let isInteracting = false;
    const dummyJointBody = new CANNON.Body({ mass: 0 });
    world.addBody(dummyJointBody);

    function onPointerDown(e) {
      if (e.target.closest('#hud-top') || e.target.closest('#weapon-bar-container')) return;
      isInteracting = true;

      const rect = renderer.domElement.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      if (activeTool === 'hand') {
        const hits = raycaster.intersectObjects(dummyMeshes);
        if (hits.length > 0) {
          const hitMesh = hits[0].object;
          const hitBody = dummyBodies.find(b => b.meshRef === hitMesh);
          if (hitBody) {
            draggedBody = hitBody;
            const pt = hits[0].point;
            dummyJointBody.position.set(pt.x, pt.y, pt.z);
            mouseConstraint = new CANNON.PointToPointConstraint(
              hitBody,
              hitBody.pointToLocalFrame(new CANNON.Vec3(pt.x, pt.y, pt.z)),
              dummyJointBody,
              new CANNON.Vec3(0, 0, 0)
            );
            world.addConstraint(mouseConstraint);
            jointMarker.position.copy(pt);
            jointMarker.visible = true;
            nativeVibrate('light');
          }
        }
      } else {
        applyToolAction(e);
      }
    }

    function onPointerMove(e) {
      if (!isInteracting) return;
      const pt = getIntersectedPoint(e);
      if (pt && mouseConstraint) {
        dummyJointBody.position.set(pt.x, pt.y, pt.z);
        jointMarker.position.copy(pt);
      }
    }

    function onPointerUp() {
      isInteracting = false;
      if (mouseConstraint) {
        world.removeConstraint(mouseConstraint);
        mouseConstraint = null;
      }
      draggedBody = null;
      jointMarker.visible = false;
    }

    const dom = renderer.domElement;
    dom.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    dom.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);
    window.addEventListener('touchcancel', onPointerUp);

    // UI Buttons
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTool = btn.getAttribute('data-tool');
        nativeVibrate('light');
        playSound('hit');
      });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      nativeVibrate('medium');
      playSound('punch');
      buildRagdoll(0, 4.0, 0);
    });

    // Update Handler
    const updateModal = document.getElementById('update-modal');
    const updateTitle = document.getElementById('update-title');
    const updateDesc = document.getElementById('update-desc');
    const updateConfirmBtn = document.getElementById('update-confirm-btn');
    const updateCancelBtn = document.getElementById('update-cancel-btn');
    let pendingDownloadUrl = null;

    document.getElementById('btn-update').addEventListener('click', () => {
      nativeVibrate('light');
      if (window.AndroidNative && window.AndroidNative.checkForUpdates) {
        window.AndroidNative.checkForUpdates();
      } else {
        alert('Check for updates is active when running inside the Android APK.');
      }
    });

    window.onUpdateResult = function(event, version, downloadUrl) {
      if (event === 'updateAvailable') {
        pendingDownloadUrl = downloadUrl;
        updateTitle.innerText = 'New Update (v' + version + ')';
        updateDesc.innerText = 'A newer version of Crash Dummy 3D is available on GitHub. Would you like to install it now?';
        updateModal.style.display = 'flex';
      }
    };

    updateCancelBtn.addEventListener('click', () => {
      updateModal.style.display = 'none';
    });

    updateConfirmBtn.addEventListener('click', () => {
      updateModal.style.display = 'none';
      if (pendingDownloadUrl && window.AndroidNative && window.AndroidNative.downloadAndInstallUpdate) {
        window.AndroidNative.downloadAndInstallUpdate(pendingDownloadUrl);
      }
    });

    const gravBtn = document.getElementById('btn-gravity');
    gravBtn.addEventListener('click', () => {
      isZeroG = !isZeroG;
      world.gravity.set(0, isZeroG ? -0.5 : -18, 0);
      gravBtn.innerHTML = isZeroG ? '<span>🛸</span> Normal G' : '<span>🌍</span> Zero G';
      nativeVibrate('medium');
    });

    const slowBtn = document.getElementById('btn-slowmo');
    slowBtn.addEventListener('click', () => {
      isSlowMo = !isSlowMo;
      slowBtn.innerHTML = isSlowMo ? '<span>⚡</span> Normal' : '<span>⏱️</span> Slow-Mo';
      slowBtn.style.color = isSlowMo ? '#00e5ff' : '#cfd8dc';
      nativeVibrate('medium');
    });

    // -------------------------------------------------------------
    // MAIN GAME LOOP
    // -------------------------------------------------------------
    let lastTime = performance.now();
    function animate(time) {
      requestAnimationFrame(animate);

      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      // Physics step
      const stepDt = isSlowMo ? dt * 0.3 : dt;
      world.step(1 / 60, stepDt, 4);

      // Sync Dummy Bodies to Meshes
      let maxSpeed = 0;
      for (let i = 0; i < dummyBodies.length; i++) {
        const body = dummyBodies[i];
        const mesh = dummyMeshes[i];
        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
        const speed = body.velocity.length();
        if (speed > maxSpeed) maxSpeed = speed;
      }
      speedValEl.innerText = maxSpeed.toFixed(1) + ' m/s';

      updateParticles();
      updateCameraShake();

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // Responsive resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
